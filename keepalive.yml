# Optional. Free Supabase projects can pause after about a week with no activity.
# This pings the database twice a week so yours stays awake.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_ANON_KEY (same values as config.js: Project URL and publishable key).
name: keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" -d '{}'
