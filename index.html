}
$('#profile').addEventListener('click',function(e){
  var b=e.target.closest('[data-ptab],[data-pview],[data-pwork]');if(!b)return;
  if(b.dataset.ptab){P.tab=b.dataset.ptab;renderProfile();return}
  if(b.dataset.pview){P.view=b.dataset.pview;renderProfile();return}
  if(b.dataset.pwork){S.rv={editing:false,rating:0};S.confirm='';workModal(b.dataset.pwork)}
});
if(window.ResizeObserver){new ResizeObserver(function(){var el=$('#profile');if(!el.hidden&&P&&P.view==='shelf'&&P.tab!=='reviews'){var w=el.clientWidth;if(Math.abs(w-(cloud.pw||0))>=12){cloud.pw=w;renderProfile()}}}).observe($('#profile'))}


/* a backup file keeps its old ids; in the shared database they must be unique, so give everything fresh ones */
function cloudRemapBackup(j){
  var W={},E={},C={},F={},R={};
  function mp(M,id,p){if(id===undefined||id===null||id==='')return id;if(!M[id])M[id]=newId(p);return M[id]}
  var out={works:{},editions:{},reviews:{},comics:{},folders:{},views:{},ignored:[]};
  Object.keys(j.works||{}).forEach(function(k){var w=Object.assign({},j.works[k]);w.id=mp(W,w.id||k,'w');out.works[w.id]=w});
  Object.keys(j.editions||{}).forEach(function(k){var e=Object.assign({},j.editions[k]);e.id=mp(E,e.id||k,'e');e.workId=mp(W,e.workId,'w');out.editions[e.id]=e});
  Object.keys(j.folders||{}).forEach(function(k){var f=Object.assign({},j.folders[k]);f.id=mp(F,f.id||k,'f');f.order=(f.order||[]).map(function(x){return mp(C,x,'c')});delete f.visibility;out.folders[f.id]=f});
  Object.keys(j.comics||{}).forEach(function(k){var c=Object.assign({},j.comics[k]);c.id=mp(C,c.id||k,'c');
    if(c.editionId)c.editionId=mp(E,c.editionId,'e');if(c.workId)c.workId=mp(W,c.workId,'w');
    c.folderIds=(c.folderIds||[]).map(function(x){return mp(F,x,'f')});out.comics[c.id]=c});
  Object.keys(j.reviews||{}).forEach(function(k){var r=Object.assign({},j.reviews[k]);r.id=mp(R,r.id||k,'r');r.workId=mp(W,r.workId,'w');out.reviews[r.id]=r});
  Object.keys(j.views||{}).forEach(function(k){var v=Object.assign({},j.views[k]);var nk=k==='all'?'all':mp(F,k,'f');v.id=nk;v.order=(v.order||[]).map(function(x){return mp(C,x,'c')});out.views[nk]=v});
  return out;
}

/* clicks that only exist in the online version; returns true when it handled the click */
function cloudClick(e,el,d){
  if(d.addEd&&!cloud.me){toast('Sign in to add books to your own shelves.');return true}
  if(d.merge){
    var mp=d.merge.split(':');
    cloudMerge(mp[0],mp[1],mp[2]).then(function(){if(S.modal&&S.modal.mode==='dupes')dupesModal()});
    return true;
  }
  switch(d.act){
    case 'account':accountModal();return true;
    case 'signout':cloudSettle().then(function(){closeModal();return sb.auth.signOut()});return true;
    case 'open-mod':modModal();return true;
    case 'copy-link':{var inp=$('#ac-link');try{navigator.clipboard.writeText(inp.value).then(function(){toast('Link copied')},function(){inp.select();toast('Press Ctrl+C to copy')})}catch(x){inp.select();toast('Press Ctrl+C to copy')}return true}
    case 'toggle-folder-vis':{var f=S.folders[S.folder];if(f){var v=f.visibility==='public'?'private':'public';putFolder(Object.assign({},f,{visibility:v}));toast(v==='public'?'This folder is now public on your profile':'This folder is private again')}return true}
    case 'merge-work':{
      var sel=$('#merge-to');if(!sel)return true;
      if(S.confirm==='merge'){var keep=sel.value,drop=S.modal.workId;S.confirm='';cloudMerge('work',keep,drop).then(function(done){if(done)workModal(keep);else workModal(drop)})}
      else{S.mergeTo=sel.value;S.confirm='merge';workModal(S.modal.workId)}
      return true}
    case 'mod-approve':case 'mod-reject':
      sb.rpc('resolve_merge',{req:d.req,approve:d.act==='mod-approve'}).then(async function(r){
        if(r.error){toast('Could not do that: '+errText(r.error));return}
        if(d.act==='mod-approve'){await cloudSettle();await cloudLoad();render()}
        modModal();toast(d.act==='mod-approve'?'Merged for everyone':'Request closed');
      });return true;
    case 'mod-swap':
      cloudMerge(d.kind,d.keep,d.drop).then(function(){modModal()});return true;
    case 'mod-del-review':
      sb.from('reviews').delete().eq('id',d.rid).then(function(r){
        if(r.error){toast('Could not remove it: '+errText(r.error));return}
        var s=S.wrev&&S.wrev[d.wid];if(s)s.list=s.list.filter(function(v){return v.id!==d.rid});
        var box=$('#rv-others');if(box){box.innerHTML=rvOthersHTML(d.wid);var h=$('#rv-head');if(h)h.innerHTML=rvHeadHTML(d.wid)}
        toast('Review removed');
      });return true;
    case 'load-examples':case 'clear-examples':return true;
  }
  return false;
}

async function init(){
  if(CLOUD_NOLIB){$('.app').hidden=true;showAuth('nolib');return}
  if(CLOUD){render();await cloudInit();return}
  render();
  var data=null;
  try{idb=await openIDB();data=await idbGet('state');S.mode='idb'}
  catch(e){idb=null;S.mode='local';try{data=JSON.parse(localStorage.getItem('longbox-data-v3')||localStorage.getItem('longbox-data-v2')||'null')}catch(e2){}}
  if(data){S.comics=data.comics||{};S.folders=data.folders||{};S.views=data.views||{};S.works=data.works||{};S.editions=data.editions||{};S.reviews=data.reviews||{};S.ignored=data.ignored||[]}
  var mg=migrate();hydrateAll();S.loaded=true;if(mg)persist();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  render();
}
init();
})();
