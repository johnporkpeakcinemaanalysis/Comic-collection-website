<style>
/* Layout: header with stats, folder rail on the left, toolbar + shelf / covers / list on the right.
   Palette is cool ink-and-paper. Spine and cover colors come from each series name, so a series always looks the same. */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --surface-2:#E3E6F0; --shelf-back:#E0E3EE;
  --ink:#12141C; --ink-2:#4B5167; --line:#D0D4E2; --plank:#AAB1C7;
  --accent:#3347E8; --accent-ink:#FFFFFF; --accent-soft:#DCE0FF;
  --good:#1D7F52; --warn:#9A6414; --danger:#B3261E;
  --display:'Bebas Neue','Oswald',Impact,'Arial Narrow',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1017; --surface:#171A25; --surface-2:#212536; --shelf-back:#121521;
    --ink:#ECEEF6; --ink-2:#9AA1B8; --line:#2B3047; --plank:#363C58;
    --accent:#8F9CFF; --accent-ink:#0E1017; --accent-soft:#252B57;
    --good:#58C48F; --warn:#E0B060; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1017; --surface:#171A25; --surface-2:#212536; --shelf-back:#121521;
  --ink:#ECEEF6; --ink-2:#9AA1B8; --line:#2B3047; --plank:#363C58;
  --accent:#8F9CFF; --accent-ink:#0E1017; --accent-soft:#252B57;
  --good:#58C48F; --warn:#E0B060; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.app{max-width:1240px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand .logo{height:80px;width:auto;display:block}
.brand p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none}
.stats li{display:flex;flex-direction:column;min-width:64px}
.stats b{font:500 22px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}

/* layout */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
.rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rail h2{margin:0 0 4px;font:400 18px/1 var(--display);letter-spacing:.08em;color:var(--ink-2)}
.flist{display:flex;flex-direction:column;gap:2px}
.fbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--ink)}
.fbtn:hover{background:var(--surface-2)}
.fbtn[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.fbtn .n{font:400 12px var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.fbtn .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addf{margin-top:6px;text-align:left;background:none;border:1px dashed var(--line);border-radius:6px;padding:8px 10px;color:var(--ink-2)}
.addf:hover{border-color:var(--accent);color:var(--accent)}
.inline-form{display:flex;gap:6px}
.inline-form input{flex:1;min-width:0}

main{min-width:0;display:flex;flex-direction:column;gap:14px}
#content{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:6px;padding:6px 14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search]{flex:1 1 220px;min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
select{padding-right:6px;max-width:100%}
.tools .seg{margin-left:auto}

.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.head h2{margin:0;font:400 30px/1 var(--display);letter-spacing:.04em}
.head .meta{color:var(--ink-2);font-size:13px}
.head .acts{display:flex;gap:6px;margin-left:auto}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.note{color:var(--ink-2);font-size:13px}
p.note{margin:0}

/* shelf view */
.shelf{position:relative;display:flex;flex-direction:column;background:var(--shelf-back);border:1px solid var(--line);border-radius:8px;padding:22px 18px 8px}
.row{display:flex;align-items:flex-end;gap:2px;min-height:40px}
.plank{height:12px;background:var(--plank);margin:0 -18px 22px;border-radius:2px;box-shadow:0 3px 0 var(--line)}
.spine{--l:36%;position:relative;flex:none;width:var(--w);height:var(--ht);display:flex;justify-content:center;align-items:flex-start;padding:8px 0;border:0;border-radius:2px 2px 0 0;
  background-color:var(--c);color:var(--fg,#fff);writing-mode:vertical-rl;font:400 14px/1 var(--display);letter-spacing:.05em;cursor:grab;
  user-select:none;-webkit-user-select:none;
  box-shadow:inset -2px 0 0 rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.14);transition:transform .15s ease}
.spine span{display:block;max-block-size:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.spine.hc{padding:18px 0;
  background-image:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)),linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4));
  background-size:100% 3px,100% 3px;background-position:0 7px,0 calc(100% - 7px);background-repeat:no-repeat}
.spine:hover,.spine:focus-visible{transform:translateY(-8px)}
.spine.dragging{z-index:20;transition:none;cursor:grabbing;box-shadow:0 14px 26px -4px rgba(0,0,0,.55),inset -2px 0 0 rgba(0,0,0,.2)}
.drop-ind{position:absolute;width:3px;border-radius:2px;background:var(--accent);z-index:10;pointer-events:none}
.legend{margin:6px 0 4px;font-size:12px;color:var(--ink-2)}

/* covers */
.cover{container-type:inline-size;position:relative;aspect-ratio:2/3;overflow:hidden;border-radius:3px;color:var(--fg,#fff);
  background:linear-gradient(160deg,var(--c1),var(--c2));max-width:100%}
.cover .cv-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:9cqw}
.cover::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.22) 1px,transparent 1.6px);background-size:7px 7px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.cover .cv-t{position:relative;z-index:1;font:400 16cqw/.94 var(--display);letter-spacing:.02em;text-wrap:balance;overflow:hidden;overflow-wrap:anywhere;max-height:60%}
.cover .cv-i{position:relative;z-index:1;font:400 22cqw/.9 var(--display);align-self:flex-end}
.cover .cv-p{position:relative;z-index:1;font:500 7cqw var(--mono);opacity:.85;letter-spacing:.06em;text-transform:uppercase}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:20px 16px}
.card{display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;background:none;border:0;padding:0}
.card .cover{box-shadow:0 2px 0 rgba(0,0,0,.18),0 8px 16px -8px rgba(0,0,0,.45);transition:transform .15s;margin-bottom:2px}
.card:hover .cover,.card:focus-visible .cover{transform:translateY(-4px)}
.card .t{font-weight:700;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .s{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .s.mono{font-family:var(--mono)}
.cardwrap{display:flex;flex-direction:column;gap:8px;min-width:0}

/* list */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font:400 14px var(--display);letter-spacing:.08em;color:var(--ink-2);background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--accent-soft)}
tbody tr:last-child td{border-bottom:0}
td.ttl{white-space:normal;min-width:180px;font-weight:700}
td.ttl small{display:block;font-weight:400;color:var(--ink-2)}
td.au{white-space:normal;min-width:140px}
td.mono{font-family:var(--mono);font-size:13px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--surface-2);color:var(--ink-2)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}

/* empty / loading */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:36px 28px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.empty h3{margin:0;font:400 30px/1 var(--display);letter-spacing:.04em}
.empty p{margin:0;max-width:52ch;color:var(--ink-2)}
.empty .acts{display:flex;flex-wrap:wrap;gap:8px}

/* modal */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;background:rgba(8,10,18,.6);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(720px,100%);margin-block:auto;background:var(--surface);border-radius:12px;padding:22px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);position:relative}
.sheet h2{margin:0;font:400 34px/1 var(--display);letter-spacing:.04em;padding-right:36px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:8px;border:0;background:var(--surface-2);font-size:18px;line-height:1}
.detail{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;margin-top:14px}
.detail .cover{width:100%}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0}
dt{color:var(--ink-2);font-size:13px}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;background:var(--surface)}
label.chip{cursor:pointer}
label.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .push{margin-left:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;margin-top:16px}
.form .full{grid-column:1/-1}
.form label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.form label.f input,.form label.f select{color:var(--ink);font-size:15px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:0}
.coverrow{display:flex;align-items:center;gap:14px}
.coverrow .cover{width:64px;flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.28)}
.sw[aria-pressed="true"],.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.sw.auto{width:auto;border-radius:99px;padding:0 12px;background:var(--surface-2);font-size:13px;color:var(--ink);box-shadow:none;border-color:var(--line)}
.sw.auto[aria-pressed="true"]{border-color:var(--ink);box-shadow:none}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#e33,#ec3,#3c5,#3cc,#35e,#c3c,#e33)}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail{position:static}
  .flist{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .fbtn{width:auto;white-space:nowrap;border:1px solid var(--line);border-radius:99px;flex:none}
  .rail h2{display:none}
  .addf{align-self:flex-start}
  .brand .logo{height:64px}
}
@media (max-width:560px){
  .detail{grid-template-columns:minmax(0,1fr)}
  .detail .cover{width:150px}
  .form{grid-template-columns:minmax(0,1fr)}
  .col-opt{display:none}
  .tools .seg{margin-left:0}
  .sheet{padding:18px}
}

/* standalone additions */
.rail-h{margin-top:18px!important}
.railtools{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.railtools .btn{display:inline-block;text-align:left}
#sync.warn{color:var(--danger);font-weight:700}
.coverbox{display:flex;flex-direction:column}
.cvctl{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.cvbtns{display:flex;flex-wrap:wrap;gap:6px}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink-2);text-align:center}
.drop.over,.drop:focus-visible{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
.cands:empty{display:none}
.cand{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;text-align:left;font-size:12px;line-height:1.25}
.cand:hover{border-color:var(--accent)}
.cand img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:3px;background:var(--surface-2)}
.cand span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.spine-ph{width:36px;height:112px;border-radius:2px;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line)}
.spine-ph.empty{display:grid;place-items:center;font-size:10px;color:var(--ink-2);text-align:center}
#spine-prev{flex:none}
.spine.photo{background-size:cover;background-position:center;background-repeat:no-repeat}
.spine.photo span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:820px){.railtools{flex-direction:row;flex-wrap:wrap}.railtools .note{flex-basis:100%}}

/* catalog */
.tools.cat select,.tools.cat .seg{display:none}
.tools.cat #q{flex:1 1 280px}
.findbar{display:flex;gap:8px;margin:10px 0 6px}
.findbar input{flex:1;min-width:0}
input[type=search],.findbar input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.rh{margin:14px 0 6px;font:400 18px/1 var(--display);letter-spacing:.08em;color:var(--ink-2)}
.fcard{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px;overflow:hidden}
.fcard.open{border-color:var(--accent)}
.frow,.catrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px}
.catrow{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:8px}
.frow:hover,.catrow:hover{background:var(--surface-2)}
.ft{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.thumb{width:44px;flex:none}
.thumb .cover{width:44px}
.feds{display:flex;flex-direction:column;gap:6px;padding:4px 10px 10px}
.fed{text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:14px}
.fed:hover,.fed.hi{border-color:var(--accent)}
.catlist{display:flex;flex-direction:column}
.lockcard{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px}
.lc-cover{width:72px;flex:none}
.lc-body{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.dupebox{border:1px solid var(--warn);background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.dupebox:empty{display:none}
.dlist,.drow{width:100%}
.drow{display:flex;gap:10px;align-items:center}
.dpair{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{display:flex;gap:10px;min-width:0}
.edrow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.rvbox{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.rvbox h3{margin:0;font:400 20px/1 var(--display);letter-spacing:.06em}
.rvhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.stars{color:var(--warn);letter-spacing:2px;font-size:17px}
.starpick{display:flex;gap:2px;margin-bottom:6px}
.star{border:0;background:none;font-size:28px;line-height:1;color:var(--line);padding:0 2px}
.star[aria-pressed="true"]{color:var(--warn)}
.rv p{margin:6px 0;white-space:pre-wrap}
.rvform textarea,.mergerow select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.mergerow{display:flex;gap:8px;align-items:center}
.mergerow select{margin:0;flex:1;min-width:0}
.scan{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;padding:16px}
.scan video{max-width:100%;max-height:70vh;border-radius:10px}
@media (max-width:560px){.dcols{grid-template-columns:1fr}.mergerow{flex-direction:column;align-items:stretch}}

.chev{color:var(--ink-2);font-size:14px;flex:none}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;padding:0;font:inherit;cursor:pointer}
.fed.other{border-style:dashed;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* online version: sign-in screen, account chip, public profile pages */
[hidden]{display:none!important}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.authcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:14px}
.authcard h2{font:400 30px/1 var(--display);letter-spacing:.04em;margin:0}
.authcard form{display:grid;gap:12px}
.authcard label{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.authcard input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 11px;font:inherit;min-width:0}
.authcard .err{color:var(--danger);margin:0;min-height:1.2em}
.authcard .ok{color:var(--good);margin:0}
.authcard .note a{color:var(--accent)}
.authtabs{display:flex}
.authtabs button{flex:1}
.acct{display:flex;align-items:center;gap:8px;margin-left:auto}
.pubdot{color:var(--good);font-size:9px;vertical-align:middle}
.acctform{display:grid;gap:10px;margin-top:10px}
.acctform label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.acctform input:not([type=checkbox]),.acctform textarea,.visrow select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;min-width:0;width:100%}
.visrow select{width:auto}
.vislist{display:grid;gap:6px;margin:6px 0}
.visrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1}
.acctform .err{color:var(--danger);margin:0}
.rvwho{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rvwho a{color:var(--accent);font-weight:700;text-decoration:none}
.pf{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
.pf-top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.pf-brand{display:block;text-decoration:none}
.pf-brand img{height:48px;width:auto;display:block}
.pf-head{display:flex;gap:16px;align-items:center}
.pf-head h1{margin:0;font:400 40px/1 var(--display);letter-spacing:.04em}
.pf-head p{margin:4px 0 0}
.pf-bio{max-width:60ch}
.pf-av{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:400 34px/1 var(--display)}
.pf-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pf-tabs .btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pf-body{display:grid;gap:14px}
.pf-reviews{display:grid;gap:10px}

/* ---------- catalog: works, editions and my copies ----------
   A WORK is the book itself (Batman: Year One). An EDITION is one printing of it (the 2005 paperback,

function bigrams(s){s=s.replace(/ /g,'');var o={},n=0;for(var i=0;i<s.length-1;i++){var g=s.substr(i,2);o[g]=(o[g]||0)+1;n++}return {o:o,n:n}}

  var A=bigrams(a),B=bigrams(b),m=0;if(!A.n||!B.n)return 0;
  Object.keys(A.o).forEach(function(g){if(B.o[g])m+=Math.min(A.o[g],B.o[g])});
  return 2*m/(A.n+B.n);
}
function surnames(a){
  return authorsOf({author:a}).map(function(n){var p=n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z\s]/g,'').trim().split(/\s+/);return p[p.length-1]}).filter(Boolean);
}
function authOverlap(a,b){
  var A=surnames(a),B=surnames(b);if(!A.length||!B.length)return null;
  return A.some(function(x){return B.indexOf(x)>-1});
}
/* how likely two entries are the same book: 1 is certain, below 0.8 is treated as different */
function workScore(a,b){
  var ka=workKey(a),kb=workKey(b);
  if(!ka.t||!kb.t)return 0;
  if(ka.v&&kb.v&&ka.v!==kb.v)return 0;
  var same=ka.t===kb.t||ka.t.replace(/ /g,'')===kb.t.replace(/ /g,'');
  var s=same?1:Math.max(jacc(ka.t,kb.t),dice(ka.t,kb.t)*0.95);
  if(!!ka.v!==!!kb.v)s*=0.85;
  var ao=authOverlap(a.author,b.author);
  if(ao===true)s=Math.min(1,s+0.06);else if(ao===false)s*=0.75;
  if(!same)s=Math.min(s,0.95);
  return s;
}
/* how well a typed search matches a catalog book */
function queryScore(q,w){
  var qn=normTitle(q);if(!qn)return 0;
  var hay=normTitle(w.title+' '+(w.issue?'vol '+w.issue:'')+' '+(w.author||'')), hs=hay.replace(/ /g,'');
  var ht=tokens(hay), qt=tokens(qn), hit=0;
  qt.forEach(function(t){
    if(ht.some(function(h){return h===t||(t.length>1&&h.indexOf(t)===0)})||(t.length>=4&&hs.indexOf(t)>-1))hit++;
  });
  var s=hit/qt.length;
  if(s<1&&!(qt.length>=3&&s>=SUGGEST)){s=hit>=qt.length-1?Math.max(0,dice(qn,normTitle(w.title))*0.9):0}   /* typo tolerance only when at most one word is off */
  return s>=SUGGEST?s+(normTitle(w.title).indexOf(qn)===0?0.2:0):0;
}
function isbn13(s){
  s=cleanIsbn(s);
  if(s.length===10){var b='978'+s.slice(0,9),sum=0;for(var i=0;i<12;i++)sum+=(+b[i])*(i%2?3:1);return b+((10-sum%10)%10)}
  return s;
}

/* ----- records ----- */
function editionsOf(wid){return list(S.editions).filter(function(e){return e.workId===wid})}
function copiesOf(eid){return list(S.comics).filter(function(c){return c.editionId===eid})}
function workCopies(wid){return list(S.comics).filter(function(c){var e=S.editions[c.editionId];return e&&e.workId===wid})}
function reviewsOf(wid){return list(S.reviews).filter(function(r){return r.workId===wid}).sort(function(a,b){return (b.updated||b.created||0)-(a.updated||a.created||0)})}
function fillBlank(o,f,keys){keys.forEach(function(k){if(!o[k]&&f[k])o[k]=f[k]})}
function fillEdition(e,f){fillBlank(e,f,E_FIELDS);e.isbn=isbn13(e.isbn)}
function newWork(f){var w={id:newId('w'),title:f.title||'',issue:f.issue||'',subtitle:f.subtitle||'',author:f.author||'',created:Date.now()};S.works[w.id]=w;return w}
function newEdition(wid,f){
  var e={id:newId('e'),workId:wid,created:Date.now()};
  E_FIELDS.forEach(function(k){e[k]=f[k]||''});
  e.format=f.format||'trade';e.binding=f.binding||'paperback';e.isbn=isbn13(e.isbn);
  S.editions[e.id]=e;return e;
}
function editionByIsbn(isbn){isbn=isbn13(isbn);if(!isbn)return null;return list(S.editions).filter(function(e){return e.isbn===isbn})[0]||null}
function sameEdition(e,f){
  return (e.binding||'paperback')===(f.binding||'paperback')&&(e.format||'trade')===(f.format||'trade')&&
    (!f.publisher||!e.publisher||String(e.publisher).toLowerCase()===String(f.publisher).toLowerCase())&&
    (!f.releaseDate||!e.releaseDate||String(e.releaseDate)===String(f.releaseDate))&&
    (!f.isbn||!e.isbn||isbn13(e.isbn)===isbn13(f.isbn));
}
function nearWorks(f,min){
  return list(S.works).map(function(w){return {work:w,score:workScore(f,w)}}).filter(function(x){return x.score>=min}).sort(function(a,b){return b.score-a.score});
}
/* Find or create the work and edition for a set of book details. Nothing already in the catalog is overwritten. */
function resolveTarget(f,opts){
  opts=opts||{};
  var ed=editionByIsbn(f.isbn);
  if(ed&&S.works[ed.workId]){var w0=S.works[ed.workId];fillBlank(w0,f,['subtitle','author']);fillEdition(ed,f);return {work:w0,edition:ed}}
  var w=opts.workId?S.works[opts.workId]:null;
  if(!w&&!opts.forceNew){var n=nearWorks(f,SAME)[0];if(n)w=n.work}
  if(w){
    fillBlank(w,f,['subtitle','author']);
    var e=editionsOf(w.id).filter(function(x){return sameEdition(x,f)})[0];
    if(e){fillEdition(e,f);return {work:w,edition:e}}
    return {work:w,edition:newEdition(w.id,f)};
  }
  w=newWork(f);return {work:w,edition:newEdition(w.id,f)};
}
/* copies show the shared details of their edition and work */
function hydrate(c){
  var e=S.editions[c.editionId], w=e&&S.works[e.workId];
  if(!e||!w)return false;
  W_FIELDS.forEach(function(k){c[k]=w[k]||''});
  E_FIELDS.forEach(function(k){c[k]=e[k]||''});
  c.workId=w.id;return true;
}
function hydrateAll(){list(S.comics).forEach(function(c){if(c.editionId)hydrate(c)})}
/* older data, and imports, carry the details on each copy: link them into the catalog */
function migrate(){
  var n=0;
  list(S.comics).forEach(function(c){
    norm(c);
    if(!isBook(c))return;
    if(!c.editionId||!S.editions[c.editionId]){
      if(!c.title)return;
      c.editionId=resolveTarget(c).edition.id;n++;
    }
    hydrate(c);
  });
  return n;
}
function stripCopy(c){
  if(!c.editionId)return c;
  var o={};Object.keys(c).forEach(function(k){if(W_FIELDS.indexOf(k)<0&&E_FIELDS.indexOf(k)<0&&k!=='workId')o[k]=c[k]});
  return o;
}
function gcCatalog(){
  var used={},wused={};
  list(S.comics).forEach(function(c){if(c.editionId)used[c.editionId]=1});
  list(S.editions).forEach(function(e){if(!used[e.id])delete S.editions[e.id]});
  list(S.editions).forEach(function(e){wused[e.workId]=1});
  list(S.reviews).forEach(function(r){wused[r.workId]=1});
  list(S.works).forEach(function(w){if(!wused[w.id])delete S.works[w.id]});
}
function mergeEditions(keepId,dropId){
  var k=S.editions[keepId],d=S.editions[dropId];
  if(keepId===dropId||!k||!d)return;
  fillEdition(k,d);
  list(S.comics).forEach(function(c){if(c.editionId===dropId)c.editionId=keepId});
  delete S.editions[dropId];
}
function dedupeEditions(wid){
  var eds=editionsOf(wid);
  for(var i=0;i<eds.length;i++)for(var j=i+1;j<eds.length;j++){
    var a=eds[i],b=eds[j];
    if(S.editions[a.id]&&S.editions[b.id]&&sameEdition(a,b))mergeEditions(a.id,b.id);
  }
}
function mergeWorks(keepId,dropId){
  var k=S.works[keepId],d=S.works[dropId];
  if(keepId===dropId||!k||!d)return;
  fillBlank(k,d,['subtitle','author']);
  list(S.editions).forEach(function(e){if(e.workId===dropId)e.workId=keepId});
  var mine=reviewsOf(keepId)[0];
  reviewsOf(dropId).forEach(function(r){
    if(!mine){r.workId=keepId;mine=r}
    else if((r.updated||r.created||0)>(mine.updated||mine.created||0)){delete S.reviews[mine.id];r.workId=keepId;mine=r}
    else delete S.reviews[r.id];
  });
  delete S.works[dropId];
  dedupeEditions(keepId);
}
/* after an import: fold together anything that is clearly the same book or the same ISBN */
function consolidate(){
  var ws=list(S.works).sort(function(a,b){return (a.created||0)-(b.created||0)});
  ws.forEach(function(w){
    ws.forEach(function(o){
      if(o.id===w.id||!S.works[w.id]||!S.works[o.id])return;
      var a=workKey(w),b=workKey(o);
      if(a.t&&a.t===b.t&&a.v===b.v&&authOverlap(w.author,o.author)!==false)mergeWorks(w.id,o.id);
    });
  });
  var seen={};
  list(S.editions).forEach(function(e){
    if(!e.isbn||!S.editions[e.id])return;
    var k=seen[e.isbn]&&S.editions[seen[e.isbn]];
    if(k){if(k.workId!==e.workId)mergeWorks(k.workId,e.workId);if(S.editions[e.id]&&S.editions[k.id])mergeEditions(k.id,e.id)}
    else seen[e.isbn]=e.id;
  });

}
function dupeKey(a,b){return [a,b].sort().join('~')}
function findDupes(){
  var ws=list(S.works),out=[],i,j;
  for(i=0;i<ws.length;i++)for(j=i+1;j<ws.length;j++){
    var s=workScore(ws[i],ws[j]);
    if(s>=NEAR&&S.ignored.indexOf(dupeKey(ws[i].id,ws[j].id))<0)out.push({type:'work',a:ws[i].id,b:ws[j].id,score:s});
  }
  ws.forEach(function(w){
    var eds=editionsOf(w.id);
    for(i=0;i<eds.length;i++)for(j=i+1;j<eds.length;j++)
      if(sameEdition(eds[i],eds[j])&&S.ignored.indexOf(dupeKey(eds[i].id,eds[j].id))<0)out.push({type:'edition',a:eds[i].id,b:eds[j].id,score:0.9});
  });
  return out.sort(function(x,y){return y.score-x.score});
}

/* ----- add flow, step 1: look the book up ----------------------------------------------------
   Search runs on Open Library (works and editions, run by the Internet Archive) and Google Books
   (ISBN and publisher data) together. Their raw results are messy: one story shows up as many
   separate records. They are normalized and clustered here, so you see one row per story and
   choose your edition inside it. */
var GB='https://www.googleapis.com/books/v1/volumes';
var storySeq=0, findTimer=null;
function isIsbnQuery(q){return /^[\d\-\sXx]+$/.test(q)&&validIsbn(cleanIsbn(q))}
function splitVolume(title){
  var t=String(title||'').replace(/\s*\([^)]*\)\s*$/,'').trim();
  var m=/^(.*?)[\s,:\-\u2013\u2014]*\b(?:volume|vol\.?|book|part|v\.?)\s*(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b\.?\s*(?:[:\-\u2013\u2014]\s*.+)?$/i.exec(t);
  if(m&&m[1].trim())return {title:m[1].trim().replace(/[,:\-\s]+$/,''),issue:String(NUMWORDS[m[2].toLowerCase()]||m[2])};
  return {title:t,issue:''};
}
function guessFormat(s){return /omnibus/i.test(s)?'omnibus':(/compendium/i.test(s)?'compendium':'trade')}
function bindingOf(s){s=String(s||'').toLowerCase();if(/hard|cloth|library|boards/.test(s))return 'hardcover';if(/paper|trade|soft|mass|pocket/.test(s))return 'paperback';return ''}
function yearOf(s){var m=/\b(1[89]\d\d|20\d\d)\b/.exec(String(s||''));return m?m[1]:''}

var COMPOUNDS={spiderman:'spider-man',xmen:'x-men',ironman:'iron man',wonderwoman:'wonder woman',antman:'ant-man',spiderwoman:'spider-woman',xfactor:'x-factor',xforce:'x-force',captainamerica:'captain america',blackpanther:'black panther',greenlantern:'green lantern',greenarrow:'green arrow',doctorstrange:'doctor strange'};
/* the databases match words literally, so try the spelling people actually print, and a shorter tail of a long query */
function queryVariants(q){
  var v=q.trim().replace(/\s+/g,' ');
  var x=v.replace(/[A-Za-z]+/g,function(w){return COMPOUNDS[w.toLowerCase()]||w}), tk=x.split(' '), out=[x];
  if(tk.length>=5){out.push(tk.slice(-3).join(' '));out.push(tk.slice(0,-3).join(' '))}   /* the distinctive tail, and the series name */
  return out;
}
async function searchMany(fn,qs){
  var res=await Promise.allSettled(qs.map(fn)), all=[];
  res.forEach(function(r){if(r.status==='fulfilled')all=all.concat(r.value)});
  if(!all.length&&res.every(function(r){return r.status==='rejected'}))throw new Error('all failed');
  return all;
}
async function searchOLOne(q){
  var r=await fetch(OL+'/search.json?q='+encodeURIComponent(q)+'&limit=20&fields=key,title,subtitle,author_name,first_publish_year,edition_count,cover_i,subject');
  if(!r.ok)throw new Error('HTTP '+r.status);
  return ((await r.json()).docs||[]).filter(function(d){return d.title&&!/#\s*\d/.test(d.title)}).map(function(d){
    var full=d.title+(d.subtitle&&!/edition|deluxe|hardcover|paperback/i.test(d.subtitle)?': '+d.subtitle:''), sv=splitVolume(full);
    return {src:'ol',title:sv.title,issue:sv.issue,author:(d.author_name||[]).slice(0,3).join(', '),year:d.first_publish_year||0,coverId:d.cover_i||0,coverUrl:'',olKey:d.key||'',edCount:d.edition_count||0,comic:/comic|graphic novel|manga/i.test((d.subject||[]).join(' '))};
  });
}
function searchOLWorks(qs){return searchMany(searchOLOne,qs)}
function recFromGB(v){
  var i=v.volumeInfo||{};
  if(!i.title||(v.saleInfo&&v.saleInfo.isEbook))return null;
  var full=i.title+(i.subtitle&&!/edition|deluxe|hardcover|paperback|collection|omnibus/i.test(i.subtitle)?': '+i.subtitle:'');
  if(/#\s*\d/.test(full))return null;
  var ids=i.industryIdentifiers||[], a=ids.filter(function(x){return x.type==='ISBN_13'})[0], b=ids.filter(function(x){return x.type==='ISBN_10'})[0];
  var isbn=a?cleanIsbn(a.identifier):(b?isbn13(b.identifier):'');
  var th=i.imageLinks&&(i.imageLinks.thumbnail||i.imageLinks.smallThumbnail);
  var cu=th?th.replace(/^http:/,'https:').replace('&edge=curl','').replace('zoom=1','zoom=2'):'';
  var sv=splitVolume(full), yr=yearOf(i.publishedDate);
  return {src:'gb',title:sv.title,issue:sv.issue,author:(i.authors||[]).slice(0,3).join(', '),year:+yr||0,coverId:0,coverUrl:cu,
    comic:/comic|graphic/i.test((i.categories||[]).join(' ')),
    edition:{src:'gb',titleFull:full,isbn:isbn,publisher:i.publisher||'',year:yr,binding:'',format:guessFormat(full),pages:i.pageCount||0,coverId:0,coverUrl:cu}};
}
async function searchGBOne(q){
  var r=await fetch(GB+'?q='+encodeURIComponent(q)+'&maxResults=30&printType=books&langRestrict=en');
  if(!r.ok)throw new Error('HTTP '+r.status);
  return ((await r.json()).items||[]).map(recFromGB).filter(Boolean);
}
function searchGB(qs){return searchMany(searchGBOne,qs)}
/* many records, one story: the same normalized title, volume and author fold together */
function clusterRecords(recs){
  recs=recs.slice().sort(function(a,b){return (a.src==='ol'?0:1)-(b.src==='ol'?0:1)||(b.edCount||0)-(a.edCount||0)});
  var cl=[];
  recs.forEach(function(r){
    var best=null,bs=0;
    cl.forEach(function(c){var s=workScore(r,c);if(s>bs){bs=s;best=c}});
    if(best&&bs>=0.85){best.members.push(r);return}
    cl.push({id:'o'+(++storySeq),title:r.title,issue:r.issue,author:r.author,members:[r]});
  });
  cl.forEach(function(c){
    var m=c.members;
    c.olKeys=m.filter(function(x){return x.olKey}).map(function(x){return x.olKey});
    c.gbEditions=m.filter(function(x){return x.edition}).map(function(x){return x.edition});
    c.edCount=m.reduce(function(s,x){return s+(x.edCount||(x.edition?1:0))},0);
    var ys=m.map(function(x){return x.year}).filter(Boolean);c.year=ys.length?Math.min.apply(null,ys):0;
    c.coverId=(m.filter(function(x){return x.coverId})[0]||{}).coverId||0;
    c.coverUrl=(m.filter(function(x){return x.coverUrl})[0]||{}).coverUrl||'';
    c.comic=m.some(function(x){return x.comic});
    if(!c.author)c.author=(m.filter(function(x){return x.author})[0]||{}).author||'';
    c.local=null;
  });
  return cl;
}
/* what is in the catalog already, merged into the online stories; catalog-only matches get their own row */
function buildStories(q){
  var on=S.find.online&&S.find.online.q===q?S.find.online.stories:[], rows=[], used={};
  on.forEach(function(c){
    var rel=queryScore(q,c);if(rel<=0)return;
    var best=null,bs=0;
    list(S.works).forEach(function(w){if(used[w.id])return;var s=workScore(c,w);if(s>bs){bs=s;best=w}});
    c.local=bs>=0.85?best:null;if(c.local)used[c.local.id]=1;
    rows.push({st:c,score:rel+(c.local?0.3:0)+(c.comic?0.15:0)+Math.min(0.2,Math.log10(c.edCount+1)*0.1)});
  });

/* Save a new shelf order. newIds is the visible books in their new order. */
function commitReorder(newIds){
  var key=S.folder;
  var scope=list(S.comics).filter(function(c){return isBook(c)&&(key==='all'||(c.folderIds||[]).indexOf(key)>-1)});
  var base=scope.sort(sorterFor(S.sort,key)).map(function(c){return c.id});
  var set={};newIds.forEach(function(id){set[id]=1});
  var slots=[];base.forEach(function(id,i){if(set[id])slots.push(i)});
  slots.forEach(function(pos,k){base[pos]=newIds[k]});
  S.sort='manual';saveUI();
  if(key==='all')putView('all',{order:base});
  else putFolder(Object.assign({},S.folders[key],{order:base,sort:'manual'}));
  toast('Saved as your shelf order');
}

function validHex(s){return /^#[0-9a-f]{6}$/i.test(s||'')}
function lum(hex){
  var n=parseInt(hex.slice(1),16),f=function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255);
}
/* Each book gets a chosen color, or one drawn from its title so a series looks alike. */
function colorVars(c){
  if(validHex(c.color)){
    var light=lum(c.color)>0.18, fg=light?'#14161e':'#fff';
    return {spine:'--c:'+c.color+';--fg:'+fg,
      cover:'--c1:'+c.color+';--c2:color-mix(in srgb,'+c.color+' '+(light?'82%,#fff':'55%,#000')+');--fg:'+fg};
  }
  var h=hue(c.title), iv=num(c.issue), l=32+(isFinite(iv)?Math.round(iv)%4:0)*3;
  return {spine:'--c:hsl('+h+' 52% '+l+'%)',cover:'--c1:hsl('+h+' 60% 46%);--c2:hsl('+((h+40)%360)+' 55% 24%)'};

async function findCoverOnline(){
  var isbn=cleanIsbn(fv('f-isbn')), title=fv('f-title').trim();
  if(!isbn&&!title){cvStatus('Enter a title or an ISBN first.');var t=$('#f-title');if(t)t.focus();return}
  $('#cands').innerHTML='';
  try{
    if(isbn&&validIsbn(isbn)){
      cvStatus('Looking up ISBN '+isbn+'…');
      try{setDraftCover(await coverByIsbn(isbn));cvStatus('Found a cover for that ISBN.');return}
      catch(e){if(navigator.onLine===false)throw e}
    } else if(isbn){cvStatus('That ISBN should have 10 or 13 digits. Searching by title instead…')}
    if(!title){cvStatus('No cover found for that ISBN. Add a title to search by name.');return}
    cvStatus('Searching Open Library…');
    var docs=await searchCovers(title,fv('f-author'));
    if(!docs.length){cvStatus('No covers found. Try the ISBN, or use Search images and drop the picture here.');return}
    cvStatus('Pick the edition that matches yours.');
    $('#cands').innerHTML=docs.map(function(d){
      return '<button type="button" class="cand" data-cand="'+d.cover_i+'" title="'+esc(d.title+(d.first_publish_year?' ('+d.first_publish_year+')':''))+'"><img src="'+olCoverUrl(d.cover_i,'M')+'" alt="" loading="lazy" referrerpolicy="no-referrer"><span>'+esc(d.title)+(d.first_publish_year?' · '+d.first_publish_year:'')+'</span></button>';
    }).join('');
  }catch(e){cvStatus(navigator.onLine===false?'You appear to be offline.':'Could not reach Open Library. Try again in a moment, or drop an image here.')}
}

/* ---------- drag to reorder (shelf) ---------- */
var drag=null, suppressClick=false;
function dragStart(){
  if(!drag||drag.active)return;
  var shelf=$('.shelf'); if(!shelf){drag=null;return}
  drag.active=true; clearTimeout(drag.timer);
  drag.sy0=window.scrollY;
  drag.rows=$$('.shelf .row');
  drag.sr0=drag.el.getBoundingClientRect();
  drag.ob=drag.el.parentNode.getBoundingClientRect().bottom;
  drag.el.classList.add('dragging'); document.body.classList.add('is-dragging');
  try{drag.el.setPointerCapture(drag.pid)}catch(e){}
  var ind=document.createElement('div');ind.className='drop-ind';ind.hidden=true;shelf.appendChild(ind);drag.ind=ind;
  requestAnimationFrame(dragTick);
}
function dragUpdate(){
  /* The book only slides left and right, and always rests on a shelf. */
  var sh=$('.shelf').getBoundingClientRect(), L=sh.left+18, R=sh.right-18, rows=drag.rows;
  var ri=0,bd=Infinity;
  rows.forEach(function(row,i){
    var r=row.getBoundingClientRect(), top=r.top-14, bottom=r.bottom+34;
    var dist=drag.py<top?top-drag.py:(drag.py>bottom?drag.py-bottom:0);
    if(dist<bd){bd=dist;ri=i}
  });
  var rr=rows[ri].getBoundingClientRect();
  var tx=Math.max(L-drag.sr0.left,Math.min(R-drag.sr0.right,drag.px-drag.x0));
  var ty=rr.bottom-(drag.ob-(window.scrollY-drag.sy0))-8; /* stay at the same lifted height as the hover */
  drag.el.style.transform='translate('+tx+'px,'+ty+'px)';
  var pxc=Math.max(L,Math.min(R,drag.px));
  var sps=$$('.spine',rows[ri]).filter(function(s){return s!==drag.el});
  var tgt=null,after=false,tr=null;
  for(var i=0;i<sps.length;i++){
    var r2=sps[i].getBoundingClientRect();
    if(pxc<r2.left+r2.width/2){tgt=sps[i];tr=r2;break}
  }
  if(!tgt&&sps.length){tgt=sps[sps.length-1];tr=tgt.getBoundingClientRect();after=true}
  if(tgt){
    drag.target=tgt.dataset.open; drag.before=!after;
    drag.ind.hidden=false;
    drag.ind.style.left=((after?tr.right+1:tr.left-2)-sh.left-1)+'px';
    drag.ind.style.top=(rr.top-sh.top)+'px';
    drag.ind.style.height=rr.height+'px';
  } else {drag.target=null;drag.ind.hidden=true}
}
function dragTick(){
  if(!drag||!drag.active)return;
  var vh=window.innerHeight;
  if(drag.py<70)window.scrollBy(0,-14); else if(drag.py>vh-70)window.scrollBy(0,14);
  dragUpdate();
  requestAnimationFrame(dragTick);
}
function dragEnd(commit){
  var d=drag; drag=null; if(!d)return;
  clearTimeout(d.timer);
  if(!d.active)return;
  d.el.classList.remove('dragging'); d.el.style.transform='';
  if(d.ind&&d.ind.parentNode)d.ind.parentNode.removeChild(d.ind);
  document.body.classList.remove('is-dragging');
  suppressClick=true; setTimeout(function(){suppressClick=false},80);
  if(commit&&d.target){
    var ids=visible().map(function(c){return c.id}), before=ids.join();
    ids=ids.filter(function(x){return x!==d.id});
    var ti=ids.indexOf(d.target); if(ti<0)return;
    ids.splice(d.before?ti:ti+1,0,d.id);
    if(ids.join()!==before)commitReorder(ids);
  }
}

    case 'dupes':dupesModal();break;
    case 'close':case 'cancel':closeModal();break;
    case 'edit':editModal(S.modal&&S.modal.id);break;
    case 'save-another':saveForm(true);break;
    case 'toggle-read':{var c2=S.comics[S.modal.id];putComic(Object.assign({},c2,{read:!c2.read}));viewModal(c2.id);break}
    case 'del-comic':
      if(S.confirm==='del-comic'){var id=S.modal.id;closeModal();delComic(id);toast('Deleted')}
      else{S.confirm='del-comic';viewModal(S.modal.id)}
      break;
    case 'remove-cover':draftCover='';draftCoverUrl='';draftCoverColor='';if(draftColorSrc==='cover'){draftColor='';draftColorSrc=''}$('#cands').innerHTML='';cvStatus('Cover removed. One will be drawn from the title.');syncSwatches();refreshCoverPrev();break;
    case 'remove-spine':draftSpine='';refreshCoverPrev();break;
    case 'fetch-cover':findCoverOnline();break;
    case 'fetch-all':fetchMissingCovers();break;
    case 'export':exportBackup();break;
    case 'new-folder':S.addingFolder=true;renderFolders();break;
    case 'rename-folder':S.renaming=true;S.confirm='';renderContent();break;
    case 'del-folder':
      if(S.confirm==='del-folder'){S.confirm='';delFolder(S.folder);toast('Folder deleted. Books stay in your collection.')}
      else{S.confirm='del-folder';renderContent()}

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#modal').hidden){closeModal();return}
  var t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('tr[data-open]')){e.preventDefault();viewModal(t.dataset.open);return}
  if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&t.matches&&t.matches('.spine')){
    e.preventDefault();
    var ids=visible().map(function(c){return c.id}), i=ids.indexOf(t.dataset.open), j=i+(e.key==='ArrowLeft'?-1:1);
    if(i<0||j<0||j>=ids.length)return;
    ids.splice(i,1);ids.splice(j,0,t.dataset.open);
    var keep=t.dataset.open;
    commitReorder(ids);
    var again=$('.spine[data-open="'+keep+'"]');if(again)again.focus();
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.dataset.form; if(!f)return;
  e.preventDefault();
  if(f==='comic')saveForm(false);
  if(f==='review'){
    var wid=e.target.dataset.wid, rtext=$('#rv-text').value.trim();
    if(!S.rv.rating){toast('Pick a star rating first.');return}
    var mine=reviewsOf(wid)[0];
    var rv=Object.assign(mine||{id:newId('r'),workId:wid,created:Date.now()},{rating:S.rv.rating,text:rtext,editionLabel:editionLabelFor(wid),updated:Date.now()});
    S.reviews[rv.id]=rv;S.rv={editing:false,rating:0};persist();render();reopenModal();toast('Review saved');
  }
  if(f==='newfolder'){
    var n=$('#nf-name').value.trim(); S.addingFolder=false;
    if(n){var id=newId('f');S.folder=id;putFolder({id:id,name:n,sort:S.sort,created:Date.now(),example:false})} else renderFolders();
  }
  if(f==='rename'){
    var nm=$('#rn-name').value.trim(),fo=S.folders[S.folder];S.renaming=false;
    if(nm&&fo)putFolder(Object.assign({},fo,{name:nm})); else renderContent();
  }
});
document.addEventListener('change',function(e){

/* paste or drop an image into the edit form */
function editOpen(){return !$('#modal').hidden&&!!$('#f-title')}
function imageFrom(dt){
  var f=null;
  if(dt&&dt.files)for(var i=0;i<dt.files.length;i++)if(/^image\//.test(dt.files[i].type)){f=dt.files[i];break}
  return f;
}
document.addEventListener('paste',function(e){
  if(!editOpen())return;
  var f=imageFrom(e.clipboardData);
  if(f){e.preventDefault();useCoverFile(f)}
});
['dragenter','dragover'].forEach(function(n){document.addEventListener(n,function(e){
  if(!editOpen())return;
  var types=e.dataTransfer&&e.dataTransfer.types?Array.prototype.slice.call(e.dataTransfer.types):[];
  if(types.indexOf('Files')<0&&types.indexOf('text/uri-list')<0)return;
  e.preventDefault();
  var z=e.target.closest&&e.target.closest('.drop');
  $$('.drop').forEach(function(d){d.classList.toggle('over',d===z)});
})});
document.addEventListener('dragleave',function(e){if(!e.relatedTarget)$$('.drop').forEach(function(d){d.classList.remove('over')})});
document.addEventListener('drop',async function(e){
  if(!editOpen())return;
  e.preventDefault();$$('.drop').forEach(function(d){d.classList.remove('over')});
  var toSpine=!!(e.target.closest&&e.target.closest('#spine-drop')), f=imageFrom(e.dataTransfer);
  if(f){toSpine?useSpineFile(f):useCoverFile(f);return}
  var url=(e.dataTransfer.getData('text/uri-list')||'').split('\n')[0].trim();
  if(/^https?:\/\//i.test(url)&&!toSpine){cvStatus('Fetching that image…');setDraftCover(await coverFromUrl(url));cvStatus('Cover added.')}
});

function rebase(){
  var b=cloud.base;b.copies={};b.folders={};b.reviews={};
  list(S.comics).forEach(function(c){if(c.editionId)b.copies[c.id]=JSON.stringify(copyRow(c))});
  list(S.folders).forEach(function(f){b.folders[f.id]=JSON.stringify(folderRow(f))});
  list(S.reviews).forEach(function(r){b.reviews[r.id]=JSON.stringify(reviewRow(r))});
  b.prefs=JSON.stringify(allOrder());
}

/* ----- loading your library ----- */
async function cloudLoad(){
  var r=await sb.rpc('my_library');
  if(r.error)throw r.error;
  var d=r.data;
  cloud.me=d.profile;
  S.works={};S.editions={};S.comics={};S.folders={};S.reviews={};
  cloud.base={works:{},editions:{},copies:{},folders:{},reviews:{},prefs:''};
  adoptCatalog(d.works,d.editions);
  (d.copies||[]).forEach(function(c){c.folderIds=c.folderIds||[];S.comics[c.id]=c});
  (d.folders||[]).forEach(function(f){S.folders[f.id]=f});
  (d.reviews||[]).forEach(function(v){S.reviews[v.id]=v});
  S.views={all:{id:'all',order:(d.profile.prefs&&d.profile.prefs.allOrder)||[]}};
  hydrateAll();normAll();hydrateAll();
  rebase();
  cloud.pulledAt=Date.now();
}

/* ----- pictures go to storage, not into the database ----- */
async function uploadDataUri(uri,name){
  var blob=await (await fetch(uri)).blob();
  var path=cloud.me.id+'/'+name+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  var up=await sb.storage.from('covers').upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000'});
  if(up.error)throw up.error;
  return sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
}

/* ----- saving: compare with what the server has and send only the differences ----- */
function cloudQueue(){clearTimeout(cloud.timer);cloud.timer=setTimeout(function(){cloud.timer=null;cloudFlush()},700);renderSync()}
async function cloudFlush(){
  if(!CLOUD||!cloud.me)return;
  clearTimeout(cloud.timer);cloud.timer=null;
  if(cloud.busy){cloud.again=true;return}
  cloud.busy=true;renderSync();
  try{
    do{cloud.again=false;await cloudPush()}while(cloud.again);
    cloud.failed=false;clearTimeout(cloud.retry);
  }catch(e){
    cloud.failed=true;if(window.console)console.warn(e);
    toast(isNet(e)?'You look offline. Your changes will be saved when you reconnect.':'Could not save: '+errText(e));
    clearTimeout(cloud.retry);cloud.retry=setTimeout(cloudFlush,10000);
  }
  cloud.busy=false;
  if(cloud.remapped){cloud.remapped=false;render()}
  renderSync();
}
async function claimOne(e){
  var w=S.works[e.workId];if(!w)return;
  if(e.cover&&/^data:/.test(e.cover)){e.coverUrl=await uploadDataUri(e.cover,'cover');e.cover=''}
  var r=await sb.rpc('claim_edition',{
    w:{id:w.id,title:w.title,issue:w.issue,subtitle:w.subtitle,author:w.author},
    e:{id:e.id,isbn:e.isbn,publisher:e.publisher,releaseDate:e.releaseDate,format:e.format,binding:e.binding,coverUrl:e.coverUrl||'',coverColor:e.coverColor||''}});
  if(r.error)throw r.error;
  var nw=r.data.work, ne=Object.assign({cover:''},r.data.edition), oldE=e.id, oldW=w.id;
  /* the server may already have this book or edition: switch to its ids */
  if(nw.id!==oldW){
    list(S.editions).forEach(function(x){if(x.workId===oldW)x.workId=nw.id});
    list(S.reviews).forEach(function(v){if(v.workId===oldW)v.workId=nw.id});
    delete S.works[oldW];
  }
  S.works[nw.id]=nw;
  if(ne.id!==oldE){
    list(S.comics).forEach(function(c){if(c.editionId===oldE)c.editionId=ne.id});
    delete S.editions[oldE];
  }
  S.editions[ne.id]=ne;
  cloud.base.works[nw.id]=wSig(nw);cloud.base.editions[ne.id]=eSig(ne);
  if(nw.id!==oldW||ne.id!==oldE)cloud.remapped=true;
  hydrateAll();
}
async function revertCatalog(kind,id){
  var r=await sb.from(kind==='work'?'works':'editions').select('*').eq('id',id).maybeSingle();
  if(!r.data)return;
  if(kind==='work'){S.works[id]=mapWork(r.data);cloud.base.works[id]=wSig(S.works[id])}
  else{S.editions[id]=mapEdition(r.data);cloud.base.editions[id]=eSig(S.editions[id])}
  hydrateAll();cloud.remapped=true;
}
async function chunked(arr,n,fn){for(var i=0;i<arr.length;i+=n)await fn(arr.slice(i,i+n))}
async function cloudPush(){
  var i,b=cloud.base;
  /* 1. books that are not in the shared catalog yet */
  var fresh=list(S.editions).filter(function(e){return !b.editions[e.id]&&copiesOf(e.id).length}).map(function(e){return e.id});
  for(i=0;i<fresh.length;i++){var fe=S.editions[fresh[i]];if(fe&&!b.editions[fe.id])await claimOne(fe)}
  /* 2. changes to catalog entries that already exist */
  var wch=list(S.works).filter(function(w){return b.works[w.id]!==undefined&&b.works[w.id]!==wSig(w)});
  for(i=0;i<wch.length;i++){
    var w=wch[i], sent=wSig(w);
    try{
      var rw=await sb.rpc('update_work',{wid:w.id,patch:{title:w.title,issue:w.issue,subtitle:w.subtitle,author:w.author}});
      if(rw.error)throw rw.error;
      S.works[w.id]=Object.assign(S.works[w.id],rw.data);b.works[w.id]=wSig(S.works[w.id]);
      if(b.works[w.id]!==sent)cloud.partial=true;
    }catch(err){if(isNet(err))throw err;await revertCatalog('work',w.id);toast('Could not change that book: '+errText(err))}
  }
  var ech=list(S.editions).filter(function(e){return b.editions[e.id]!==undefined&&b.editions[e.id]!==eSig(e)});
  for(i=0;i<ech.length;i++){
    var e=ech[i];
    try{
      if(e.cover&&/^data:/.test(e.cover)){e.coverUrl=await uploadDataUri(e.cover,'cover');e.cover=''}
      var sentE=eSig(e);
      var re=await sb.rpc('update_edition',{eid:e.id,patch:{isbn:e.isbn,publisher:e.publisher,releaseDate:e.releaseDate,format:e.format,binding:e.binding,coverUrl:e.coverUrl||'',coverColor:e.coverColor||''}});
      if(re.error)throw re.error;
      S.editions[e.id]=Object.assign(S.editions[e.id],re.data,{cover:''});b.editions[e.id]=eSig(S.editions[e.id]);
      if(b.editions[e.id]!==sentE)cloud.partial=true;
    }catch(err2){if(isNet(err2)||!err2.code)throw err2;await revertCatalog('edition',e.id);toast('Could not change that edition: '+errText(err2))}
  }
  if(cloud.partial){cloud.partial=false;cloud.remapped=true;toast('Some details are shared with everyone and can only be changed by whoever added the book, so only blank fields were filled in.')}
  /* 3. your copies */
  var cs=list(S.comics).filter(function(c){return c.editionId&&b.editions[c.editionId]!==undefined}), up=[];
  for(i=0;i<cs.length;i++){
    var c=cs[i];
    if(c.spineImg&&/^data:/.test(c.spineImg))c.spineImg=await uploadDataUri(c.spineImg,'spine');
    var row=copyRow(c), sig=JSON.stringify(row);
    if(b.copies[c.id]!==sig)up.push({row:row,sig:sig});
  }
  await chunked(up,100,async function(part){
    var r=await sb.from('copies').upsert(part.map(function(x){return x.row}),{onConflict:'id'});
    if(r.error)throw r.error;
    part.forEach(function(x){b.copies[x.row.id]=x.sig});
  });
  var gone=Object.keys(b.copies).filter(function(id){return !S.comics[id]});
  await chunked(gone,100,async function(part){
    var r=await sb.from('copies').delete().in('id',part);
    if(r.error)throw r.error;
    part.forEach(function(id){delete b.copies[id]});
  });
  /* 4. folders */
  var fu=[];
  list(S.folders).forEach(function(f){var row=folderRow(f),sig=JSON.stringify(row);if(b.folders[f.id]!==sig)fu.push({row:row,sig:sig})});
  if(fu.length){
    var rf=await sb.from('folders').upsert(fu.map(function(x){return x.row}),{onConflict:'id'});
    if(rf.error)throw rf.error;
    fu.forEach(function(x){b.folders[x.row.id]=x.sig});
  }
  var fg=Object.keys(b.folders).filter(function(id){return !S.folders[id]});
  if(fg.length){
    var rd=await sb.from('folders').delete().in('id',fg);
    if(rd.error)throw rd.error;
    fg.forEach(function(id){delete b.folders[id]});
  }
  /* 5. the order of "All books" */
  var po=JSON.stringify(allOrder());
  if(po!==b.prefs){
    var prefs=Object.assign({},cloud.me.prefs||{},{allOrder:allOrder()});
    var rp=await sb.from('profiles').update({prefs:prefs}).eq('id',cloud.me.id);
    if(rp.error)throw rp.error;
    cloud.me.prefs=prefs;b.prefs=po;
  }
  /* 6. reviews (after their books exist on the server) */
  var ru=[];
  list(S.reviews).forEach(function(v){
    if(b.works[v.workId]===undefined)return;
    var row=reviewRow(v),sig=JSON.stringify(row);if(b.reviews[v.id]!==sig)ru.push({row:Object.assign({user_id:cloud.me.id},row),sig:sig,id:v.id});
  });
  for(i=0;i<ru.length;i++){
    var rr=await sb.from('reviews').upsert(ru[i].row,{onConflict:'user_id,work_id'});
    if(rr.error)throw rr.error;
    b.reviews[ru[i].id]=ru[i].sig;
  }
  var rg=Object.keys(b.reviews).filter(function(id){return !S.reviews[id]});
  if(rg.length){
    var rx=await sb.from('reviews').delete().in('id',rg);
    if(rx.error)throw rx.error;
    rg.forEach(function(id){delete b.reviews[id]});
  }
}
function cloudDirty(){return !!(cloud.timer||cloud.busy||cloud.failed)}
async function cloudSettle(){clearTimeout(cloud.timer);cloud.timer=null;if(cloud.busy){await new Promise(function(r){var t=setInterval(function(){if(!cloud.busy){clearInterval(t);r()}},100)})}await cloudFlush()}
function renderSync(){
  var sy=$('#sync');if(!sy||!CLOUD)return;
  sy.textContent=cloud.failed?'Not saved yet. Retrying…':(cloud.timer||cloud.busy?'Saving…':'Saved to your account');
  sy.classList.toggle('warn',cloud.failed);
}
function renderAcct(){
  var a=$('#acct');if(!a)return;
  a.innerHTML=cloud.me?'<button type="button" class="btn small" data-act="account">@'+esc(cloud.me.username)+(isMod()?' · mod':'')+'</button>':'';
}
window.addEventListener('beforeunload',function(e){if(CLOUD&&cloud.me&&cloudDirty()){e.preventDefault();e.returnValue=''}});
window.addEventListener('online',function(){if(CLOUD&&cloud.me&&cloud.failed)cloudFlush()});
document.addEventListener('visibilitychange',function(){
  if(!CLOUD||!cloud.me)return;
  if(document.visibilityState==='hidden'&&cloud.timer)cloudFlush();
  if(document.visibilityState==='visible'&&!cloudDirty()&&!S.modal&&!(drag&&drag.active)&&Date.now()-cloud.pulledAt>60000&&$('#profile').hidden){
    cloudLoad().then(function(){render()},function(){});
  }
});

/* ----- sign in, sign up, reset ----- */

  if(mode==='nolib')return '<div class="authwrap"><div class="authcard">'+brand+'<p class="err">The sign-in library could not be loaded. Check your connection and reload the page.</p></div></div>';

  var f='';
  if(mode==='signin')f='<form data-auth="signin" novalidate><label>Email<input id="au-email" type="email" autocomplete="email" required></label><label>Password<input id="au-pass" type="password" autocomplete="current-password" required></label>'+note+'<button class="btn primary" type="submit">Sign in</button><button type="button" class="linkbtn" data-auth-mode="forgot">Forgot your password?</button></form>';
  if(mode==='signup')f='<form data-auth="signup" novalidate><label>Username<input id="au-user" autocomplete="username" maxlength="24" placeholder="letters, numbers and underscores" required></label><label>Email<input id="au-email" type="email" autocomplete="email" required></label><label>Password<input id="au-pass" type="password" autocomplete="new-password" minlength="8" required><span class="note">At least 8 characters.</span></label>'+note+'<button class="btn primary" type="submit">Create account</button><p class="note">Your username appears on your public page and your reviews. Your email never does.</p></form>';
  if(mode==='forgot')f='<form data-auth="forgot" novalidate><h2>Reset your password</h2><label>Email<input id="au-email" type="email" autocomplete="email" required></label>'+note+'<button class="btn primary" type="submit">Send reset link</button><button type="button" class="linkbtn" data-auth-mode="signin">Back to sign in</button></form>';
  if(mode==='reset')f='<form data-auth="reset" novalidate><h2>Choose a new password</h2><label>New password<input id="au-pass" type="password" autocomplete="new-password" minlength="8" required></label>'+note+'<button class="btn primary" type="submit">Save password</button></form>';
  return '<div class="authwrap"><div class="authcard">'+brand+tabs+f+'<p class="note"><a href="#/">ComicSpace</a> keeps your collection in your account, so it follows you to any device.</p></div></div>';
}
function showAuth(mode,msg,kind){authMode=mode;var a=$('#auth');a.innerHTML=authHTML(mode,msg,kind);a.hidden=false;$('.app').hidden=true;$('#profile').hidden=true;var i=$('#au-user')||$('#au-email')||$('#au-pass');if(i&&mode!=='loading')i.focus()}
function authMsg(m,kind){var p=$('#auth .err,#auth .ok');if(p){p.textContent=m;p.className=kind==='ok'?'ok':'err';p.setAttribute('role',kind==='ok'?'status':'alert')}}
$('#auth').addEventListener('click',function(e){
  var b=e.target.closest('[data-auth-mode]');if(!b)return;
  var m=b.dataset.authMode;
  if(m==='retry'){cloud.uid=null;sb.auth.getSession().then(function(r){cloudEnter(r.data.session)});return}
  if(m==='signout'){sb.auth.signOut();return}
  showAuth(m);
});
$('#auth').addEventListener('submit',async function(e){
  var f=e.target.dataset.auth;if(!f)return;
  e.preventDefault();
  var btn=$('button[type=submit]',e.target), email=$('#au-email')&&$('#au-email').value.trim(), pass=$('#au-pass')&&$('#au-pass').value;
  function busy(on){if(btn)btn.disabled=on}
  try{
    busy(true);
    if(f==='signin'){
      if(!email||!pass){authMsg('Enter your email and password.');return}
      var r=await sb.auth.signInWithPassword({email:email,password:pass});
      if(r.error){authMsg(r.error.message);return}
      await cloudEnter(r.data.session);
    }
    if(f==='signup'){
      var u=$('#au-user').value.trim().toLowerCase();
      if(!/^[a-z0-9_]{3,24}$/.test(u)){authMsg('A username is 3 to 24 letters, numbers or underscores.');return}
      if(!email){authMsg('Enter your email address.');return}
      if(!pass||pass.length<8){authMsg('Choose a password of at least 8 characters.');return}
      var av=await sb.rpc('username_available',{u:u});
      if(av.data===false){authMsg('That username is taken. Try another.');return}
      var s=await sb.auth.signUp({email:email,password:pass,options:{data:{username:u},emailRedirectTo:location.origin+location.pathname}});
      if(s.error){authMsg(s.error.message);return}
      if(s.data.session)await cloudEnter(s.data.session);
      else showAuth('signin','Account created. Check your email for a confirmation link, then sign in.','ok');
    }
    if(f==='forgot'){
      if(!email){authMsg('Enter your email address.');return}
      var rr=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(rr.error){authMsg(rr.error.message);return}
      authMsg('If that address has an account, a reset link is on its way.','ok');
    }
    if(f==='reset'){
      if(!pass||pass.length<8){authMsg('Choose a password of at least 8 characters.');return}
      var ru=await sb.auth.updateUser({password:pass});
      if(ru.error){authMsg(ru.error.message);return}
      cloud.uid=null;var gs=await sb.auth.getSession();await cloudEnter(gs.data.session);toast('Password updated');
    }
  }catch(err){authMsg(isNet(err)?'Could not reach the server. Check your connection.':errText(err))}
  finally{busy(false)}
});

/* ----- entering and leaving the app ----- */
async function cloudEnter(session){
  if(!session||cloud.entering)return;
  if(cloud.uid===session.user.id&&cloud.me){routeNow();return}
  cloud.entering=true;
  try{
    cloud.uid=session.user.id;cloud.email=session.user.email||'';
    await cloudLoad();
    S.loaded=true;
    routeNow();
  }catch(err){cloud.uid=null;cloud.me=null;showAuth('error',isNet(err)?'Could not reach the server. Check your connection.':errText(err))}
  cloud.entering=false;
}
function routeNow(){
  var m=/^#\/u\/([A-Za-z0-9_]{3,24})\/?$/.exec(location.hash||'');
  if(m){showProfile(m[1].toLowerCase());return}
  $('#profile').hidden=true;
  if(cloud.me){$('#auth').hidden=true;$('.app').hidden=false;render();renderAcct()}
  else if(cloud.ready)showAuth(authMode==='reset'?'reset':'signin');
}
window.addEventListener('hashchange',function(){
  if(!CLOUD||!cloud.ready)return;
  if(S.modal)closeModal();
  routeNow();
});
async function cloudInit(){
  S.mode='cloud';
  $('.app').hidden=true;
  showAuth('loading');
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){
      if(ev==='PASSWORD_RECOVERY'){cloud.ready=true;showAuth('reset');return}
      if(ev==='SIGNED_OUT'&&cloud.ready){
        cloud.uid=null;cloud.me=null;S.comics={};S.folders={};S.works={};S.editions={};S.reviews={};S.views={};S.loaded=false;
        cloud.base={works:{},editions:{},copies:{},folders:{},reviews:{},prefs:''};
        S.modal=null;$('#modal').hidden=true;authMode='signin';routeNow();return}
      if(ev==='SIGNED_IN'&&cloud.ready&&session&&authMode!=='reset')cloudEnter(session);
    },0);
  });
  var r=await sb.auth.getSession();
  cloud.ready=true;
  if(authMode==='reset')return;
  if(r.data&&r.data.session)await cloudEnter(r.data.session);
  else{S.loaded=true;routeNow()}
}

/* ----- shared catalog: search it as you type, look up ISBNs in it ----- */
function cloudSearchSoon(q){
  clearTimeout(cloud.sTimer);
  if(!CLOUD||q.length<2||isIsbnQuery(q))return;
  cloud.sTimer=setTimeout(async function(){
    try{
      var r=await sb.rpc('search_works',{q:q,lim:30});
      if(r.error||!r.data||S.find.q.trim()!==q)return;
      adoptCatalog(r.data.works,r.data.editions);
      if($('#find-results'))renderFind();
    }catch(e){}
  },250);
}
async function cloudIsbn(k){
  try{
    var r=await sb.rpc('catalog_by_isbn',{v_isbn:k});
    if(r.data){adoptCatalog([r.data.work],[r.data.edition]);return true}

/* ----- merging duplicates: moderators merge, everyone else suggests ----- */
async function cloudMerge(kind,keep,drop){
  var tbl=kind==='work'?cloud.base.works:cloud.base.editions;
  if(tbl[keep]===undefined||tbl[drop]===undefined){toast('One of those is still being saved. Try again in a moment.');return false}
  if(isMod()){
    await cloudSettle();
    var r=await sb.rpc(kind==='work'?'merge_works':'merge_editions',{p_keep:keep,p_drop:drop});
    if(r.error){toast('Could not merge: '+errText(r.error));return false}
    await cloudLoad();render();toast('Merged for everyone');return true;
  }
  var q=await sb.from('merge_requests').insert({kind:kind,keep_id:keep,drop_id:drop});
  if(q.error){toast('Could not send that: '+errText(q.error));return false}
  toast('Thanks. A moderator will review your suggestion.');return false;
}
async function modModal(){
  S.modal={mode:'mod',id:null};
  $('#sheet').innerHTML='<button type="button" class="x" data-act="close" aria-label="Close">×</button><h2 id="mtitle">Merge requests</h2><p class="note">Loading…</p>';
  openModal();
  var r=await sb.from('merge_requests').select('*').eq('status','open').order('created_at');
  if(!S.modal||S.modal.mode!=='mod')return;
  if(r.error){$('#sheet').innerHTML='<button type="button" class="x" data-act="close" aria-label="Close">×</button><h2 id="mtitle">Merge requests</h2><p class="err">'+esc(errText(r.error))+'</p>';return}
  var reqs=r.data||[], wids={}, eids={};
  reqs.forEach(function(q){(q.kind==='work'?wids:eids)[q.keep_id]=1;(q.kind==='work'?wids:eids)[q.drop_id]=1});
  var we=Object.keys(eids), ws=Object.keys(wids);
  var er=we.length?await sb.from('editions').select('*').in('id',we):{data:[]};
  (er.data||[]).forEach(function(x){wids[x.work_id]=1});
  var allW=Object.keys(wids);
  var wr=allW.length?await sb.from('works').select('*').in('id',allW):{data:[]};
  var wed=allW.length?await sb.from('editions').select('*').in('work_id',allW):{data:[]};
  adoptCatalog((wr.data||[]).map(mapWork),(wed.data||[]).map(mapEdition));
  function card(kind,id){
    if(kind==='work'){var w=S.works[id];if(!w)return '<div class="dcard"><span class="note">Removed</span></div>';return '<div class="dcard">'+thumbFor(w)+'<span class="ft"><b>'+esc(nameOf(w))+'</b><span class="note">'+esc(w.author||'No author')+'</span><span class="note">'+editionsOf(id).length+' editions</span></span></div>'}
    var e=S.editions[id],w2=e&&S.works[e.workId];if(!e||!w2)return '<div class="dcard"><span class="note">Removed</span></div>';
    return '<div class="dcard">'+thumbFor(w2)+'<span class="ft"><b>'+esc(nameOf(w2))+'</b><span class="note">'+esc(edLabel(e))+'</span></span></div>';
  }
  var html=reqs.length?reqs.map(function(q){
    return '<div class="dpair"><div class="note">Suggested merge of two '+(q.kind==='work'?'books':'editions')+', '+esc(new Date(q.created_at).toLocaleDateString())+'</div><div class="dcols">'+card(q.kind,q.keep_id)+card(q.kind,q.drop_id)+'</div>'+
      '<div class="chips"><button type="button" class="btn small primary" data-act="mod-approve" data-req="'+esc(q.id)+'">Keep left, merge right into it</button>'+
      '<button type="button" class="btn small" data-act="mod-swap" data-kind="'+esc(q.kind)+'" data-keep="'+esc(q.drop_id)+'" data-drop="'+esc(q.keep_id)+'">Keep right instead</button>'+
      '<button type="button" class="btn small" data-act="mod-reject" data-req="'+esc(q.id)+'">Not the same</button></div></div>';
  }).join(''):'<p class="note">No open requests.</p>';
  $('#sheet').innerHTML='<button type="button" class="x" data-act="close" aria-label="Close">×</button><h2 id="mtitle">Merge requests</h2><p class="note">Merging changes the book for everyone: copies, editions and reviews all move to the one you keep.</p>'+html+'<div class="actions"><span class="push"></span><button type="button" class="btn" data-act="cancel">Done</button></div>';
}

/* ----- reviews from everyone ----- */
function rvOthers(wid){var s=S.wrev&&S.wrev[wid];return s&&s.list?s.list.filter(function(v){return !cloud.me||v.userId!==cloud.me.id}):[]}
function rvStats(wid){
  var ratings=rvOthers(wid).map(function(v){return v.rating}), mine=reviewsOf(wid)[0];
  if(mine)ratings.push(mine.rating);
  return {n:ratings.length,avg:ratings.length?ratings.reduce(function(a,b){return a+b},0)/ratings.length:0};
}
function rvHeadHTML(wid){
  var st=rvStats(wid);
  return '<h3>Reviews</h3>'+(st.n?'<span class="stars" role="img" aria-label="Average rating '+st.avg.toFixed(1)+' out of 5">'+stars(st.avg)+'</span><span class="note">'+st.avg.toFixed(1)+' · '+st.n+(st.n===1?' review':' reviews')+'</span>':'<span class="note">No reviews yet</span>');
}
function rvOthersHTML(wid){
  var s=S.wrev&&S.wrev[wid];
  if(!s||s.state==='loading')return '<p class="note">Loading reviews…</p>';
  if(s.state==='error')return '<p class="note">Could not load other reviews.</p>';
  var o=rvOthers(wid);
  return o.map(function(v){
    return '<div class="rv"><div class="rvwho"><a href="#/u/'+esc(v.username)+'">@'+esc(v.username)+'</a> <span class="stars" role="img" aria-label="'+v.rating+' out of 5">'+stars(v.rating)+'</span></div>'+(v.text?'<p>'+esc(v.text)+'</p>':'')+
      '<div class="note">'+esc(new Date(v.updated).toLocaleDateString())+(v.editionLabel?' · on '+esc(v.editionLabel):'')+'</div>'+
      (isMod()?'<div class="chips"><button type="button" class="btn small danger" data-act="mod-del-review" data-rid="'+esc(v.id)+'" data-wid="'+esc(wid)+'">Remove</button></div>':'')+'</div>';
  }).join('');
}
async function loadWorkReviews(wid){
  S.wrev=S.wrev||{};
  var cur=S.wrev[wid];
  if(cur&&(cur.state==='loading'||(cur.state==='ready'&&Date.now()-cur.at<60000)))return;
  S.wrev[wid]={state:'loading',list:cur?cur.list:[]};
  var r=await sb.from('reviews').select('id,user_id,work_id,rating,body,edition_label,updated_at,profiles(username,display_name)').eq('work_id',wid).order('updated_at',{ascending:false}).limit(50);
  if(r.error){S.wrev[wid]={state:'error',list:[]};}
  else S.wrev[wid]={state:'ready',at:Date.now(),list:(r.data||[]).map(function(x){return {id:x.id,userId:x.user_id,workId:x.work_id,rating:x.rating,text:x.body,editionLabel:x.edition_label,updated:Date.parse(x.updated_at)||0,username:(x.profiles&&x.profiles.username)||'someone'}})};
  var box=$('#rv-others');
  if(box&&box.dataset.wid===wid){box.innerHTML=rvOthersHTML(wid);var h=$('#rv-head');if(h)h.innerHTML=rvHeadHTML(wid)}
}
function reviewsHTMLCloud(wid){
  var w=S.works[wid];if(!w)return '';
  var mine=reviewsOf(wid)[0], body;
  if(cloud.base.works[wid]!==undefined)loadWorkReviews(wid);
  if(!cloud.me){body='<p class="note">Sign in to write a review.</p>'}
  else if(mine&&!S.rv.editing){
    body='<div class="rv"><div class="stars" role="img" aria-label="'+mine.rating+' out of 5">'+stars(mine.rating)+'</div>'+(mine.text?'<p>'+esc(mine.text)+'</p>':'')+
      '<div class="note">Your review'+(mine.editionLabel?' · on '+esc(mine.editionLabel):'')+'</div>'+
      '<div class="chips"><button type="button" class="btn small" data-act="edit-review">Edit</button><button type="button" class="btn small danger" data-act="del-review">Delete</button></div></div>';
  } else {
    var r=S.rv.rating||0;
    body='<form class="rvform" data-form="review" data-wid="'+esc(wid)+'"><div class="starpick" role="group" aria-label="Your rating">'+
      [1,2,3,4,5].map(function(n){return '<button type="button" class="star" data-star="'+n+'" aria-label="'+n+' star'+(n>1?'s':'')+'" aria-pressed="'+(n<=r)+'">★</button>'}).join('')+'</div>'+
      '<label class="sr" for="rv-text">Review</label><textarea id="rv-text" rows="3" maxlength="4000" placeholder="What did you think? Art, story, how the edition holds up">'+esc(mine&&S.rv.editing?mine.text:'')+'</textarea>'+
      '<div class="chips"><button type="submit" class="btn small primary">'+(mine?'Save changes':'Post review')+'</button>'+(mine?'<button type="button" class="btn small" data-act="cancel-review">Cancel</button>':'')+'</div></form>';
  }
  return '<section class="rvbox"><div class="rvhead" id="rv-head">'+rvHeadHTML(wid)+'</div>'+body+'<div id="rv-others" data-wid="'+esc(wid)+'">'+rvOthersHTML(wid)+'</div><p class="note">Reviews are public and show your username.</p></section>';
}

/* ----- your profile, and what you share ----- */

    '<p class="note">Anything not marked public stays private. Your notes are never shown to anyone.</p>'+

$('#sheet').addEventListener('submit',async function(e){
  if(e.target.id!=='acct-form')return;

  var upd={display_name:$('#ac-name').value.trim(),bio:$('#ac-bio').value.trim(),library_public:$('#ac-lib').checked,wishlist_public:$('#ac-wish').checked};

  cloud.me.displayName=upd.display_name;cloud.me.bio=upd.bio;cloud.me.libraryPublic=upd.library_public;cloud.me.wishlistPublic=upd.wishlist_public;
  $$('[data-fvis]',$('#sheet')).forEach(function(s){var f=S.folders[s.dataset.fvis];if(f&&(f.visibility==='public')!==(s.value==='public'))putFolder(Object.assign({},f,{visibility:s.value}))});
  closeModal();toast('Profile saved');
});

/* ----- public profile pages ----- */
function pItems(tab){
  if(!P)return [];
  var W={},E={},items=[];
  P.works.forEach(function(w){W[w.id]=w});P.editions.forEach(function(e){E[e.id]=e});
  var f=P.folders.filter(function(x){return x.id===tab})[0];
  P.copies.forEach(function(c){
    var e=E[c.editionId],w=e&&W[e.workId];if(!w)return;
    var inTab=tab==='lib'?c.status==='own':tab==='wish'?c.status==='wish':(c.status==='own'&&(c.folderIds||[]).indexOf(tab)>-1);
    if(!inTab)return;
    items.push(Object.assign({},w,e,{id:c.id,workId:w.id,editionId:e.id,status:c.status,read:c.read,added:c.added,color:c.color,colorSource:c.colorSource,spineImg:c.spineImg}));
  });
  if(f&&f.sort==='manual'){var m={};(f.order||[]).forEach(function(id,i){m[id]=i});return items.sort(function(a,b){var x=m[a.id],y=m[b.id];return cmpNum(x===undefined?Infinity:x,y===undefined?Infinity:y)||byRelease(a,b)})}
  return items.sort(SORTERS[(f&&f.sort)||'release']||byRelease);
}
function pTabs(){
  var t=[];
  if(P.profile.libraryPublic)t.push(['lib','All books']);
  P.folders.slice().sort(function(a,b){return (a.created||0)-(b.created||0)}).forEach(function(f){t.push([f.id,f.name])});
  if(P.profile.wishlistPublic)t.push(['wish','Wishlist']);
  t.push(['reviews','Reviews']);
  return t;
}
function renderProfile(){
  var el=$('#profile');if(!P)return;
  var p=P.profile, tabs=pTabs();
  if(!P.tab||!tabs.some(function(t){return t[0]===P.tab}))P.tab=tabs[0][0];
  if(!P.view)P.view='shelf';
  var own=cloud.me&&cloud.me.id===p.id;
  var nBooks=P.copies.filter(function(c){return c.status==='own'}).length;
  var top='<div class="pf-top"><a class="pf-brand" href="#/" aria-label="ComicSpace home"><img src="'+LOGO+'" alt="ComicSpace"></a><span class="push"></span>'+
    (cloud.me?'<a class="btn small" href="#/">'+(own?'Back to my collection':'My collection')+'</a>':'<a class="btn small primary" href="#/">Sign in or create an account</a>')+'</div>';
  var head='<header class="pf-head"><div class="pf-av" aria-hidden="true">'+esc((p.displayName||p.username).charAt(0).toUpperCase())+'</div><div><h1>'+esc(p.displayName||('@'+p.username))+'</h1><p class="note">@'+esc(p.username)+' · joined '+esc(new Date(p.joined).toLocaleDateString(undefined,{month:'long',year:'numeric'}))+'</p>'+(p.bio?'<p class="pf-bio">'+esc(p.bio)+'</p>':'')+
    '<p class="note">'+nBooks+(nBooks===1?' book':' books')+' shared · '+P.reviews.length+(P.reviews.length===1?' review':' reviews')+(own?' · this is how others see your page':'')+'</p></div></header>';
  var tb='<div class="pf-tabs" role="tablist">'+tabs.map(function(t){return '<button type="button" role="tab" class="btn small" data-ptab="'+esc(t[0])+'" aria-pressed="'+(t[0]===P.tab)+'">'+esc(t[1])+'</button>'}).join('')+'</div>';
  var body='';
  if(P.tab==='reviews'){
    var W={};P.works.forEach(function(w){W[w.id]=w});
    body=P.reviews.length?'<div class="pf-reviews">'+P.reviews.map(function(v){var w=W[v.workId];return '<div class="rv"><div class="rvwho"><button type="button" class="linkbtn" data-pwork="'+esc(v.workId)+'">'+esc(w?nameOf(w):'A book')+'</button> <span class="stars" role="img" aria-label="'+v.rating+' out of 5">'+stars(v.rating)+'</span></div>'+(v.text?'<p>'+esc(v.text)+'</p>':'')+'<div class="note">'+esc(new Date(v.updated).toLocaleDateString())+'</div></div>'}).join('')+'</div>':'<div class="empty"><h3>No reviews yet</h3></div>';
  } else {
    var items=pItems(P.tab);
    if(!items.length)body='<div class="empty"><h3>Nothing on this shelf yet</h3></div>';
    else {
      var viewSw='<div class="seg" role="group" aria-label="View"><button type="button" data-pview="shelf" aria-pressed="'+(P.view==='shelf')+'">Shelf</button><button type="button" data-pview="grid" aria-pressed="'+(P.view==='grid')+'">Covers</button></div>';
      if(P.view==='grid'){
        body=viewSw+'<div class="grid">'+items.map(function(c){return '<div class="cardwrap"><button type="button" class="card" data-pwork="'+esc(c.workId)+'">'+coverHTML(c)+'<span class="t">'+esc(nameOf(c))+'</span>'+(c.author?'<span class="s">'+esc(c.author)+'</span>':'')+'</button></div>'}).join('')+'</div>';
      } else {
        var wd=(el.clientWidth||900)-70, rows=[[]], used=0;
        items.forEach(function(c){var sw=(FORMATS[c.format]||FORMATS.trade).w+(c.binding==='hardcover'?6:0)+2;if(used+sw>wd&&rows[rows.length-1].length){rows.push([]);used=0}rows[rows.length-1].push(c);used+=sw});
        body=viewSw+'<div class="shelf">'+rows.map(function(r){return '<div class="row">'+r.map(function(c){return spineHTML(c).replace('data-open="'+esc(c.id)+'"','data-pwork="'+esc(c.workId)+'"')}).join('')+'</div><div class="plank"></div>'}).join('')+'</div>';
      }
    }
  }
  el.innerHTML='<div class="pf">'+top+head+tb+'<div class="pf-body">'+body+'</div></div>';
}
async function showProfile(name){
  $('.app').hidden=true;$('#auth').hidden=true;
  var el=$('#profile');el.hidden=false;
  el.innerHTML='<div class="pf"><div class="pf-top"><a class="pf-brand" href="#/" aria-label="ComicSpace home"><img src="'+LOGO+'" alt="ComicSpace"></a></div><p class="note">Loading…</p></div>';
  var r=await sb.rpc('public_profile',{uname:name});
  if(location.hash.toLowerCase().indexOf('#/u/'+name)!==0)return;
  if(r.error||!r.data){el.innerHTML='<div class="pf"><div class="pf-top"><a class="pf-brand" href="#/" aria-label="ComicSpace home"><img src="'+LOGO+'" alt="ComicSpace"></a></div><div class="empty"><h3>No one goes by @'+esc(name)+'</h3><p>Check the spelling of the link.</p></div></div>';P=null;return}
  P=r.data;P.tab='';P.view='shelf';
  adoptCatalog(P.works,P.editions);
